name: Deploy to Cloudflare Pages

# Direct-upload Pages project: Cloudflare does not build this repo, so the
# build runs here and wrangler uploads public/. Keeps the daily HN digest
# workflow's push to master publishing the site, as Vercel used to.
on:
  push:
    branches: [master]
  # The HN Daily Digest commits with its own GITHUB_TOKEN, and GitHub does not
  # trigger `on: push` workflows for pushes made with GITHUB_TOKEN (an
  # anti-recursion rule). Vercel still updated because its Git integration
  # listens on a webhook, not on Actions. So the digest's completion is the
  # event that publishes its post here.
  workflow_run:
    workflows: ["HN Daily Digest"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The FixIt theme is vendored under themes/, so no submodules.
          submodules: false
          # On workflow_run, build the commit the digest just pushed; on push,
          # the pushed commit itself.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Hugo (extended)
        env:
          HUGO_VERSION: 0.156.0
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o /tmp/hugo.tar.gz "$url"
          tar -xzf /tmp/hugo.tar.gz -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hugo" version

      - name: Build site
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=hnnews --branch=master
