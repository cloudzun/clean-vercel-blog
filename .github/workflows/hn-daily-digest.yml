name: HN Daily Digest

on:
  schedule:
    - cron: '14 22 * * *'  # 北京时间每天 06:14 (UTC 22:14)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Generate and publish HN digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POSTS_DIR: content/posts
          GITHUB_ACTIONS: true
        run: node .github/scripts/generate-improved.js
